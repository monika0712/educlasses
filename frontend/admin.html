<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Dashboard | EduClasses</title>

<link rel="icon" href="assets/images/icon.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<script src="assets/js/api-config.js"></script>

<style>
body{
    background:#f4f6f9;
    margin:0;
    padding-top:90px;   /* Space for fixed header */
}

/* Sticky Header */
.dashboard-header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1050;
    background:navy;
    color:white;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

.badge-new{ background:#0d6efd; }
.badge-contacted{ background:#fd7e14; }
.badge-closed{ background:#198754; }
</style>

</head>

<body>

<div class="dashboard-header">
<h4>EduClasses Admin Dashboard</h4>
<a href="#" onclick="adminLogout()" class="btn btn-light fw-bold">Logout</a>
</div>

<div class="container mt-5">

<ul class="nav nav-tabs mb-4">
<li class="nav-item">
<button type="button" class="nav-link active" id="studentsTabBtn" onclick="showAdminTab('students')">Students</button>
</li>
<li class="nav-item">
<button type="button" class="nav-link" id="enquiriesTabBtn" onclick="showAdminTab('enquiries')">Enquiries</button>
</li>
<li class="nav-item">
<button type="button" class="nav-link" id="batchesTabBtn" onclick="showAdminTab('batches')">Batch Schedule</button>
</li>
</ul>

<div id="studentsTab">
<h5 class="mb-3">Registered Students</h5>
<div class="table-responsive">
<table class="table table-striped bg-white">
<thead>
<tr><th>Name</th><th>Email</th><th>Phone</th><th>Course</th><th>Joined</th></tr>
</thead>
<tbody id="studentsBody">
<tr><td colspan="5">Loading...</td></tr>
</tbody>
</table>
</div>
</div>

<div id="enquiriesTab" class="d-none">
<h5 class="mb-3">Contact Form Enquiries</h5>
<div class="table-responsive">
<table class="table table-striped bg-white">
<thead>
<tr><th>Name</th><th>Email</th><th>Phone</th><th>Branch</th><th>Course</th><th>Message</th><th>Status</th></tr>
</thead>
<tbody id="enquiriesBody">
<tr><td colspan="7">Loading...</td></tr>
</tbody>
</table>
</div>
</div>

<div id="batchesTab" class="d-none">
<h5 class="mb-3" id="batchFormTitle">Add New Batch</h5>
<form id="addBatchForm" class="row g-2 bg-white p-3 rounded shadow-sm mb-4">
  <input type="hidden" id="batchEditId" value="">
  <div class="col-md-3">
    <input type="text" class="form-control" id="batchCourseName" placeholder="Course Name" required>
  </div>
  <div class="col-md-2">
    <input type="text" class="form-control" id="batchStartDate" placeholder="Start Date (e.g. 01 Apr'26)" required>
  </div>
  <div class="col-md-2">
    <input type="text" class="form-control" id="batchEndDate" placeholder="End Date (e.g. 30 Sep'26)" required>
  </div>
  <div class="col-md-2">
    <input type="text" class="form-control" id="batchTimings" placeholder="Timings (e.g. 09:00 - 17:00)" required>
  </div>
  <div class="col-md-1">
    <input type="text" class="form-control" id="batchDays" placeholder="Days" required>
  </div>
  <div class="col-md-2">
    <input type="text" class="form-control" id="batchLocation" placeholder="Location" required>
  </div>
  <div class="col-md-2">
    <select class="form-select" id="batchStatus">
      <option value="Upcoming">Upcoming</option>
      <option value="Ongoing">Ongoing</option>
      <option value="Completed">Completed</option>
    </select>
  </div>
  <div class="col-md-1">
    <button type="submit" class="btn btn-primary w-100" id="batchSubmitBtn">Add</button>
  </div>
  <div class="col-md-1">
    <button type="button" class="btn btn-outline-secondary w-100 d-none" id="batchCancelBtn" onclick="resetBatchForm()">Cancel</button>
  </div>
  <div class="col-12">
    <small id="addBatchMsg" class="text-danger"></small>
  </div>
</form>

<h5 class="mb-3">Upcoming Batches</h5>
<div class="table-responsive">
<table class="table table-striped bg-white">
<thead>
<tr><th>Batch Name</th><th>Start Date</th><th>End Date</th><th>Timings</th><th>Days</th><th>Location</th><th>Status</th><th></th></tr>
</thead>
<tbody id="batchesBody">
<tr><td colspan="8">Loading...</td></tr>
</tbody>
</table>
</div>
</div>

</div>

<script>

function formatDateDDMMYYYY(dateStr) {
    const d = new Date(dateStr);

    if (isNaN(d.getTime())) return "-";

    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yyyy = d.getFullYear();

    return `${dd}/${mm}/${yyyy}`;
}

function parseBatchDate(str){
  if(!str) return new Date(0);
  const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
  const match = String(str).trim().match(/(\d{1,2})\s*([A-Za-z]+)\s*'?\s*(\d{2,4})/);
  if(!match) return new Date(0);
  const day = parseInt(match[1], 10);
  const monKey = match[2].toLowerCase().slice(0, 3);
  const month = months[monKey] !== undefined ? months[monKey] : 0;
  let year = parseInt(match[3], 10);
  if(year < 100) year += 2000;
  return new Date(year, month, day);
}

function adminLogout(){
  localStorage.removeItem("eduAdminToken");
  window.location = "admin-login.html";
}

function getAdminToken(){
  const token = localStorage.getItem("eduAdminToken");
  if(!token){
    window.location = "admin-login.html";
  }
  return token;
}

function showAdminTab(tab){
  const tabs = {
    students: { panel: document.getElementById("studentsTab"), btn: document.getElementById("studentsTabBtn") },
    enquiries: { panel: document.getElementById("enquiriesTab"), btn: document.getElementById("enquiriesTabBtn") },
    batches: { panel: document.getElementById("batchesTab"), btn: document.getElementById("batchesTabBtn") },
  };

  Object.keys(tabs).forEach((key) => {
    if(key === tab){
      tabs[key].panel.classList.remove("d-none");
      tabs[key].btn.classList.add("active");
    } else {
      tabs[key].panel.classList.add("d-none");
      tabs[key].btn.classList.remove("active");
    }
  });

  if(tab === "batches"){
    loadBatches();
  }
}

async function loadStudents(){
  const token = getAdminToken();
  const tbody = document.getElementById("studentsBody");

  try {
    const res = await fetch(`${API_BASE_URL}/api/admin/students`, {
      headers: { Authorization: `Bearer ${token}` },
    });

    if(res.status === 401 || res.status === 403){
      adminLogout();
      return;
    }

    const data = await res.json();

    if(!data.students || data.students.length === 0){
      tbody.innerHTML = `<tr><td colspan="5">No students registered yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = data.students.map(s => `
      <tr>
        <td>${s.fullName}</td>
        <td>${s.email}</td>
        <td>${s.phone || "-"}</td>
        <td>${s.course || "-"}</td>
<td>${formatDateDDMMYYYY(s.createdAt)}</td>      </tr>
    `).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5">Could not reach the server. Is the backend running?</td></tr>`;
  }
}

async function loadEnquiries(){
  const token = getAdminToken();
  const tbody = document.getElementById("enquiriesBody");

  try {
    const res = await fetch(`${API_BASE_URL}/api/admin/enquiries`, {
      headers: { Authorization: `Bearer ${token}` },
    });

    if(res.status === 401 || res.status === 403){
      adminLogout();
      return;
    }

    const data = await res.json();

    if(!data.enquiries || data.enquiries.length === 0){
      tbody.innerHTML = `<tr><td colspan="7">No enquiries yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = data.enquiries.map(e => `
      <tr>
        <td>${e.firstName} ${e.lastName}</td>
        <td>${e.email}</td>
        <td>${e.phone}</td>
        <td>${e.branch}</td>
        <td>${e.course || "-"}</td>
        <td>${e.message || "-"}</td>
        <td>
          <select class="form-select form-select-sm" onchange="updateEnquiryStatus('${e._id}', this.value)">
            <option value="new" ${e.status === "new" ? "selected" : ""}>New</option>
            <option value="contacted" ${e.status === "contacted" ? "selected" : ""}>Contacted</option>
            <option value="closed" ${e.status === "closed" ? "selected" : ""}>Closed</option>
          </select>
        </td>
      </tr>
    `).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7">Could not reach the server. Is the backend running?</td></tr>`;
  }
}

async function updateEnquiryStatus(id, status){
  const token = getAdminToken();
  try {
    const res = await fetch(`${API_BASE_URL}/api/admin/enquiries/${id}`, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify({ status }),
    });

    if(res.status === 401 || res.status === 403){
      adminLogout();
      return;
    }

    if(!res.ok){
      alert("Could not update enquiry status.");
      loadEnquiries();
    }
  } catch (err) {
    alert("Could not reach the server. Is the backend running?");
    loadEnquiries();
  }
}

function statusBadgeClass(status){
  if(status === "Ongoing") return "bg-warning text-dark";
  if(status === "Completed") return "bg-secondary";
  return "bg-success";
}

async function loadBatches(){
  const token = getAdminToken();
  const tbody = document.getElementById("batchesBody");

  try {
    const res = await fetch(`${API_BASE_URL}/api/admin/batches`, {
      headers: { Authorization: `Bearer ${token}` },
    });

    if(res.status === 401 || res.status === 403){
      adminLogout();
      return;
    }

    const data = await res.json();
    const sortedBatches = (data.batches || []).slice().sort((a, b) => parseBatchDate(a.startDate) - parseBatchDate(b.startDate));
    window.__batchesCache = sortedBatches;

    if(sortedBatches.length === 0){
      tbody.innerHTML = `<tr><td colspan="8">No batches added yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = sortedBatches.map(b => `
      <tr>
        <td>${b.courseName}</td>
        <td>${b.startDate}</td>
        <td>${b.endDate}</td>
        <td>${b.timings}</td>
        <td>${b.days}</td>
        <td>${b.location}</td>
        <td><span class="badge ${statusBadgeClass(b.status)}">${b.status || "Upcoming"}</span></td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" onclick="editBatch('${b._id}')">Edit</button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteBatch('${b._id}')">Delete</button>
        </td>
      </tr>
    `).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8">Could not reach the server. Is the backend running?</td></tr>`;
  }
}

function editBatch(id){
  const batch = (window.__batchesCache || []).find(b => b._id === id);
  if(!batch) return;

  document.getElementById("batchEditId").value = batch._id;
  document.getElementById("batchCourseName").value = batch.courseName;
  document.getElementById("batchStartDate").value = batch.startDate;
  document.getElementById("batchEndDate").value = batch.endDate;
  document.getElementById("batchTimings").value = batch.timings;
  document.getElementById("batchDays").value = batch.days;
  document.getElementById("batchLocation").value = batch.location;
  document.getElementById("batchStatus").value = batch.status || "Upcoming";

  document.getElementById("batchFormTitle").textContent = "Edit Batch";
  document.getElementById("batchSubmitBtn").textContent = "Update";
  document.getElementById("batchCancelBtn").classList.remove("d-none");

  document.getElementById("addBatchForm").scrollIntoView({ behavior: "smooth" });
}

function resetBatchForm(){
  document.getElementById("addBatchForm").reset();
  document.getElementById("batchEditId").value = "";
  document.getElementById("batchFormTitle").textContent = "Add New Batch";
  document.getElementById("batchSubmitBtn").textContent = "Add";
  document.getElementById("batchCancelBtn").classList.add("d-none");
  document.getElementById("addBatchMsg").textContent = "";
}

async function deleteBatch(id){
  const token = getAdminToken();
  if(!confirm("Delete this batch?")) return;

  try {
    const res = await fetch(`${API_BASE_URL}/api/admin/batches/${id}`, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${token}` },
    });

    if(res.status === 401 || res.status === 403){
      adminLogout();
      return;
    }

    loadBatches();
  } catch (err) {
    alert("Could not reach the server. Is the backend running?");
  }
}

document.getElementById("addBatchForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const token = getAdminToken();
  const msgEl = document.getElementById("addBatchMsg");
  msgEl.textContent = "";

  const editId = document.getElementById("batchEditId").value;

  const payload = {
    courseName: document.getElementById("batchCourseName").value.trim(),
    startDate: document.getElementById("batchStartDate").value.trim(),
    endDate: document.getElementById("batchEndDate").value.trim(),
    timings: document.getElementById("batchTimings").value.trim(),
    days: document.getElementById("batchDays").value.trim(),
    location: document.getElementById("batchLocation").value.trim(),
    status: document.getElementById("batchStatus").value,
  };

  const url = editId ? `${API_BASE_URL}/api/admin/batches/${editId}` : `${API_BASE_URL}/api/admin/batches`;
  const method = editId ? "PUT" : "POST";

  try {
    const res = await fetch(url, {
      method,
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify(payload),
    });

    const data = await res.json();

    if(res.status === 401 || res.status === 403){
      adminLogout();
      return;
    }

    if(!res.ok){
      msgEl.textContent = data.message || "Could not save batch.";
      return;
    }

    resetBatchForm();
    loadBatches();
  } catch (err) {
    msgEl.textContent = "Could not reach the server. Is the backend running?";
  }
});

loadStudents();
loadEnquiries();

</script>

</body>
</html>
